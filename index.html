<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pakizzle | Elite Real Estate Portal</title>
    
    <!-- Browser UI Theme Colors and Pre-paint Script -->
    <meta name="theme-color" content="#FAF3E6" id="theme-color-meta" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("pakizzle-theme") || localStorage.getItem("theme");
          var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored === "dark" || ((!stored || stored === "system") && systemDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add("dark");
            root.classList.remove("light");
            root.style.colorScheme = "dark";
            var meta = document.getElementById("theme-color-meta");
            if (meta) meta.setAttribute("content", "#000000");
          } else {
            root.classList.add("light");
            root.classList.remove("dark");
            root.style.colorScheme = "light";
            var meta = document.getElementById("theme-color-meta");
            if (meta) meta.setAttribute("content", "#FAF3E6");
          }
          // Enable smooth transition after first paint without flash
          window.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
              root.classList.add("theme-transition");
            }, 100);
          });
        } catch (e) {}
      })();
    </script>
    
    <!-- Key SEO Fallbacks -->
    <meta name="description" content="Pakizzle is the premium real estate marketplace for Pakistan. Browse, buy, and sell certified luxury homes, high-rise apartments, premium commercial spaces, and residential land plots with immersive feeds, unified agent portals, and verified listings." />
    <meta name="keywords" content="luxury real estate, homes for sale, apartments, pakizzle, premium properties, certified property inspections, real estate agent pakistan, zameen, premium property marketplace" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    
    <!-- Open Graph Previews -->
    <meta property="og:title" content="Pakizzle | Elite Real Estate Portal" />
    <meta property="og:description" content="Browse, buy, and sell luxury homes, apartments, and commercial spaces on the ultimate property portal. Immersive video reels, interactive agent portals, and verified listings." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&h=630&q=80" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pakizzle" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pakizzle | Elite Real Estate Portal" />
    <meta name="twitter:description" content="Browse and sell luxury properties with instant video reels, interactive agent portals, and certified real estate listings." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    
    <!-- High-Performance Asynchronous Non-Blocking Web Fonts with swap & weight subsetting -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Manrope:wght@500;700&display=swap" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Manrope:wght@500;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Manrope:wght@500;700&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: gateway · go build + vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: apps/gateway/go.sum
      - name: go build
        working-directory: apps/gateway
        run: go build ./...
      - name: go vet
        working-directory: apps/gateway
        run: go vet ./...

  web:
    name: web · typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_GATEWAY_URL: https://api.pakizzle.amsterdamhostel.cloud
      NEXT_PUBLIC_AI_URL: https://ai.pakizzle.amsterdamhostel.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: next build
        working-directory: apps/web
        run: npm run build

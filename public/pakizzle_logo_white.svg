  <!-- Supporting Tagline in Light Gold / Translucent Cream -->
  <text x="69" y="52" font-family="'Plus Jakarta Sans', 'Manrope', 'Poppins', ui-sans-serif, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.8" fill="#FAF3E6" opacity="0.85">

  <!-- Wordmark: Pakizzle (Crisp White for Dark/Purple backgrounds) -->
  <text x="68" y="38" font-family="'Plus Jakarta Sans', 'Manrope', 'Poppins', ui-sans-serif, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.8" fill="#FFFFFF">
